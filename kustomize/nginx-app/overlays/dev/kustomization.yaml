apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: dev-
nameSuffix: -alpha

labels:
- includeSelectors: true
  pairs:
    project: ecommerce-app
    tier: backend
    env: dev

commonAnnotations:
  team: finance
  maintainer: 'finance@ourcompany.org'
  repository: 'git-repo'

#images:
#  - name: nginx
#    newTag: '1.27.1'

replicas:
  - name: nginx
    count: 2

#generatorOptions: # em todo o arquivo yaml gerado
#  disableNameSuffixHash: true

configMapGenerator:
  - name: feature-flag-config
    literals:
      - use_db=true
      - expose_metrics=true
      - some_other_feature=true
    #options:
    #  disableNameSuffixHash: true
  - name: db-init-config
    files:
      - db-init.js

secretGenerator:
  - name: local-config
    envs:
    - .env.local
    type: Opaque

# merge patchs
patches:
 # - path: update-resources.patch.yaml
 # - path: use-stable-tag.patch.yaml
 # - path: remove-resources.patch.yaml     

  - path: use-latest-tag.patch.yaml
  - path: mount-db-init.patch.yaml
  - path: remove-resources.patch.json 
    target:
      group: apps
      version: v1
      kind: Deployment
      #name: nginx

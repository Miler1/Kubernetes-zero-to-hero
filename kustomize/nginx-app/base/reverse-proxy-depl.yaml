apiVersion: apps/v1
kind: Deployment
metadata:
  name: reverse-proxy
spec:
  selector:
    matchLabels:
      app: reverse-proxy
  template:
    metadata:
      labels:
        app: reverse-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.0
        resources:
          requests:
            memory: '500Mi'
            cpu: '100m'
          limits:
            memory: '256Mi'
        ports:
        - containerPort: 80
        #volumeMounts:
        #  - name: db-config
        #    mountPath: /db/config

apiVersion: apps/v1
kind: Pod
metadata:
  name: reverse-proxy-pod
  app: reverse-proxy-standalone
spec:
  containers:
  - name: nginx
    image: nginx:1.27.0
    resources:
      requests:
        memory: '500Mi'
        cpu: '100m'
      limits:
        memory: '256Mi'
    ports:
    - containerPort: 80
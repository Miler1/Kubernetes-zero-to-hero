apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.0
        resources:
          requests:
            memory: '500Mi'
            cpu: '100m'
          limits:
            memory: '256Mi'
        ports:
        - containerPort: 80
        volumeMounts:
          - name: db-config
            mountPath: /db/config
    volumes:
      - name: db-config
        configMap:
          name: db-init-config